<p-card header="Teilnahmeübersicht: {{ tournament?.name }}">
  <div class="my-3 participation-overview-table-wrapper">
    <p-table [value]="rows" class="participation-overview-table">
      <ng-template #header>
        <tr>
          <th>Nachname</th>
          <th>Vorname</th>
          <th>Einzel</th>
          <th>Doppel</th>
          <th>Mixed</th>
          <th *ngFor="let day of dayHeaders">{{ day.date | date:'EE dd.MM' }}</th>
        </tr>
      </ng-template>
      <ng-template #body let-row>
        <tr>
          <td>{{ row.lastName }}</td>
          <td>{{ row.firstName }}</td>
          <td>{{ row.single ? 'Ja' : 'Nein' }}</td>
          <td>{{ row.double ? 'Ja' : 'Nein' }}</td>
          <td>{{ row.mixed ? 'Ja' : 'Nein' }}</td>
          <td *ngFor="let dayTime of row.dayTimes">{{ dayTime }}</td>
        </tr>
      </ng-template>
      <ng-template pTemplate="emptymessage">
        <tr>
          <td [attr.colspan]="5 + dayHeaders.length" class="text-center">
            <p-message severity="info" text="Keine Registrierungen vorhanden"></p-message>
          </td>
        </tr>
      </ng-template>
    </p-table>
  </div>

  <div class="button-group">
    <p-button label="Zurück" severity="secondary" icon="pi pi-arrow-left" (click)="goBack()"></p-button>
    <p-button label="Teilnehmer" severity="secondary" icon="pi pi-users" (click)="showRegistrations()"></p-button>
  </div>
</p-card>
