<p-card header="Benutzer">
  @if (isMobile) {
    <div class="user-list">
      <div *ngFor="let user of users" class="user-row" (click)="editUser(user.id)">
        <div class="user-avatar">
          <img [src]="getProfileImageUrl(user.id)" class="user-avatar-img" alt=""
               (error)="hideImage($event)" />
          <span class="user-avatar-initials">{{ user.firstName.charAt(0) }}{{ user.lastName.charAt(0) }}</span>
        </div>
        <div class="user-name">{{ user.lastName }}, {{ user.firstName }}</div>
      </div>
      <div *ngIf="users.length === 0" class="user-empty">
        <p-message severity="info" text="Keine Benutzer vorhanden"></p-message>
      </div>
    </div>
  } @else {
    <div class="my-3">
      <p-table [value]="users" class="users-table">
        <ng-template #header >
          <tr>
            <th>Nachname</th>
            <th>Vorname</th>
            <th>E-Mail</th>
            <th>Mobiltelefon</th>
            <th>Stärke</th>
            <th>Status</th>
            <th>Admin</th>
          </tr>
        </ng-template>
        <ng-template #body let-user>
          <tr>
            <td class="user-name-cell" (click)="editUser(user.id)">{{ user.lastName }}</td>
            <td>{{ user.firstName }}</td>
            <td>{{ user.email }}</td>
            <td>{{ user.mobile }}</td>
            <td>{{ user.strength ?? '–' }}</td>
            <td>
              <p-toggleswitch
                [ngModel]="user.active"
                (ngModelChange)="toggleActive(user, $event)"
              ></p-toggleswitch>
            </td>
            <td>
              <p-toggleswitch
                [ngModel]="user.roles.includes('ADMIN')"
                (ngModelChange)="toggleAdminRole(user, $event)"
              ></p-toggleswitch>
            </td>
          </tr>
        </ng-template>
        <ng-template pTemplate="emptymessage">
          <tr>
            <td colspan="7" class="text-center">
              <p-message severity="info" text="Keine Benutzer vorhanden"></p-message>
            </td>
          </tr>
        </ng-template>
      </p-table>
    </div>
  }

  <div class="button-group" *ngIf="isAdmin">
    <p-button label="Neuer Benutzer" routerLink="/user/new"></p-button>
  </div>
</p-card>
